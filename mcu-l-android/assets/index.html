<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <title>MCUS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="splash">
    <div class="chip-logo">M</div>
    <div class="splash-title">MCUS</div>
    <div class="splash-sub">离线器件目录正在载入</div>
  </div>
  <div id="app" hidden>
    <header class="topbar">
      <div class="brand-row">
        <div class="brand"><span class="brand-mark">M</span><span>MCUS</span></div>
        <div class="snapshot" id="snapshot-pill"></div>
      </div>
      <div id="search-slot"></div>
    </header>
    <main id="view"></main>
    <nav class="bottom-nav" id="bottom-nav">
      <button data-tab="catalog"><span>▦</span><b>目录</b></button>
      <button data-tab="search"><span>⌕</span><b>搜索</b></button>
      <button data-tab="compare"><span>⇄</span><b>对比</b><i id="compare-badge"></i></button>
      <button data-tab="data"><span>●</span><b>数据</b></button>
      <button data-tab="author"><span>A</span><b>作者</b></button>
    </nav>
    <div id="detail-layer"></div>
    <div id="toast"></div>
  </div>
  <script src="catalog.js"></script>
  <script src="app.js"></script>
</body>
</html>
